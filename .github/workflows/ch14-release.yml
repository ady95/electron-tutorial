# 14-2: v로 시작하는 태그(v1.0.1 등)를 push하면 두 OS에서 만들어 GitHub Releases에 올린다
# 순서: 초안 만들기 → Windows·macOS가 각자 설치 파일 올리기 → 둘 다 끝나면 공개
name: ch14 Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 릴리스를 만들고 파일을 올린다

jobs:
  draft:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ch14-release
    steps:
      - uses: actions/checkout@v5

      - name: 태그와 package.json 버전 비교
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 package.json 버전(v$VERSION)이 다릅니다"
            exit 1
          fi

      - name: 릴리스 초안 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "AI 채팅 $GITHUB_REF_NAME" \
            --notes "책 14장 예제(ch14-release)의 시험 배포입니다. Windows는 ai-chat-setup.exe, macOS는 ai-chat.dmg를 받으세요."

  publish:
    needs: draft
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ch14-release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ch14-release/package-lock.json

      - run: npm ci
      - run: npm test

      # 저장소 비밀 값에 넣어 둔 인증서(.pfx를 base64로 바꾼 글자)를 파일로 되돌린다
      - name: 서명 인증서 준비 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if (-not $env:CERT_BASE64) { Write-Output '인증서가 없어 서명하지 않고 만듭니다'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
          "WINDOWS_CERTIFICATE_FILE=$pfx" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: 만들고 릴리스 초안에 올리기
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

  finish:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: 릴리스 공개
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false -R "$GITHUB_REPOSITORY"
